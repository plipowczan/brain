name: KB maintenance

# Keeps the navigation indexes fresh and surfaces vault-health drift without
# relying on anyone remembering to run /reindex or /lint. Inspired by OpenWiki's
# "doc drift is a CI problem, not a discipline problem" design.
#
# This vault's notes + deploy live on the `v4` branch, so this workflow explicitly
# checks out v4 and opens its PR against v4.
#
# CRON NOTE: GitHub only fires `schedule:` triggers from the workflow file on the
# repository's DEFAULT branch. That default is now `v4` (it used to be `hugo`), so
# the copy on v4 is the one that schedules — no cross-branch duplication needed.
# (workflow_dispatch always works regardless of branch.)
#
# ⚠️ PATHS ARE COUPLED TO SKILL DIRECTORY NAMES. The `brain-*` rename in efee0e1b
# (2026-07-23) moved `.claude/skills/{reindex,lint}/` to `.claude/skills/brain-*/`
# and silently broke this workflow — it failed every Monday from 2026-07-27 until
# fixed on 2026-08-06. If you rename a skill folder, grep this file.
#
# What it does:
#   1. Checks out v4 and rebuilds content/_indexes/{vault-map,catalog,graph}.md.
#   2. Runs the lint scanner for a health summary.
#   3. Opens ONE PR against v4 if — and only if — the rebuild changed the indexes
#      in substance (a restamped `updated:` timestamp alone never triggers a PR).
#
# Nothing here mutates notes. The only writes are to _indexes/, via a PR you review.

on:
  schedule:
    - cron: "0 6 * * 1"      # every Monday 06:00 UTC (fires only from the default branch)
  workflow_dispatch: {}       # run manually from the Actions tab

# GITHUB_TOKEN needs to push a branch and open a PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kb-maintain
  cancel-in-progress: false

env:
  TARGET_BRANCH: v4

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4          # notes live on v4, not the hugo default branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python deps
        run: pip install pyyaml

      - name: Rebuild indexes
        run: python .claude/skills/brain-reindex/scripts/build_indexes.py

      - name: Lint report
        id: lint
        run: |
          python .claude/skills/brain-lint/scripts/lint_scan.py > lint-report.json || true
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          if hasattr(sys.stdout, "reconfigure"):
              sys.stdout.reconfigure(encoding="utf-8")
          data = json.loads(pathlib.Path("lint-report.json").read_text(encoding="utf-8"))
          counts = {k: v for k, v in data.get("counts", {}).items() if v}
          print("## Vault health\n")
          print(f"- **{data.get('total', 0)} notes** scanned")
          if counts:
              print("- Issues:")
              for k, v in sorted(counts.items(), key=lambda kv: -kv[1]):
                  print(f"  - `{k}`: {v}")
          else:
              print("- No issues found. ✅")
          PY

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
          if-no-files-found: ignore

      # build_indexes.py restamps the `updated:` field on every run, so a plain
      # `git diff` is never clean. Treat the indexes as changed ONLY if some line
      # other than an `updated:` timestamp moved.
      - name: Detect substantive index changes
        id: diff
        run: |
          substantive="$(git diff -U0 -- content/_indexes \
            | grep -E '^[+-]' \
            | grep -Ev '^(\+\+\+|---)' \
            | grep -Ev '^[+-]updated:' || true)"
          if [ -n "$substantive" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Indexes already current (timestamp-only churn ignored)."
            git checkout -- content/_indexes
          fi

      - name: Open / update maintenance PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: kb-maintenance/reindex
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add content/_indexes
          git commit -m "chore(kb): refresh navigation indexes"
          git push --force-with-lease origin "$BRANCH"

          # Reuse the open PR from a previous run if one exists.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$BRANCH" \
              --title "chore(kb): refresh navigation indexes" \
              --body "Automated \`/reindex\` — the navigation indexes drifted from the notes and have been rebuilt.

          See the run's **Vault health** summary and the \`lint-report\` artifact for outstanding issues.

          Generated by \`.github/workflows/kb-maintain.yml\`. Merge to accept, or close to discard."
          else
            echo "PR for $BRANCH already open — force-pushed the refreshed indexes to it."
          fi
